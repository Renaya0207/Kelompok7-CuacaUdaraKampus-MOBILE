
name: udara_kampus
description: Aplikasi informasi cuaca kampus dengan desain modern dan playful.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Mengambil data cuaca dari REST API Open-Meteo
  http: ^1.2.2

  # Mengelola state dan menghubungkan ViewModel ke tampilan
  provider: ^6.1.2

  # Ikon bawaan Flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  # Mengaktifkan Material Icons
  uses-material-design: true

  assets:
    - assets/images/
